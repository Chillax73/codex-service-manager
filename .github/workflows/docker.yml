name: Docker integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Docker tools and fixture image
        run: |
          docker info > /dev/null
          docker compose version
          docker pull python:3.12-slim
      - name: Container and Compose acceptance
        run: /usr/bin/python3 tests/verify_docker.py
      - name: Real container failure acceptance
        run: /usr/bin/python3 tests/verify_docker_failures.py
      - name: Project rename, delete and restore with real containers
        run: /usr/bin/python3 tests/verify_project_docker.py
